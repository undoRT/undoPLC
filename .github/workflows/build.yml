name: Build and Release

on:
  push:
    branches:
      - main
      - develop
      - 'feature/*'
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. Checkout code (with submodules)
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0

    # 2. Ensure submodules are fully initialized
    - name: Init submodules
      run: git submodule update --init --recursive

    # 3. Install dependencies
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake g++ libboost-all-dev rsync

    # 4. Configure CMake
    - name: Configure CMake
      run: |
        mkdir -p build
        cd build
        cmake -DCMAKE_BUILD_TYPE=Release \
              -DBUILD_TESTS=OFF \
              ..

    # 5. Build
    - name: Build project
      run: |
        cd build
        make -j$(nproc)

    # 6. Package release artifacts (SELF-CONTAINED)
    - name: Package release artifacts
      run: |
        set -e

        mkdir -p release/include
        mkdir -p release/src
        mkdir -p release/third_party
        mkdir -p release/tests

        # Headers
        cp include/*.hpp release/include/

        # Library
        if [ -f "src/libundoPLC.a" ]; then
          cp src/libundoPLC.a release/src/
        elif [ -f "build/libundoPLC.a" ]; then
          cp build/libundoPLC.a release/src/
        else
          echo "ERROR: libundoPLC.a not found"
          exit 1
        fi

        # FULL vendor snapshot (submodules included)
        if [ -d "third_party" ]; then
          rsync -a third_party/ release/third_party/
        fi

        # Remove git metadata
        find release/third_party -type d -name ".git" -exec rm -rf {} + || true

        # Tests
        if [ -d "tests" ]; then
          cp -r tests release/
          find release/tests -name "build" -type d -exec rm -rf {} + || true
          find release/tests -name "CMakeFiles" -type d -exec rm -rf {} + || true
        fi

    # 7. Verify structure
    - name: Verify release
      run: |
        echo "=== RELEASE CONTENTS ==="
        find release -maxdepth 3

    # 8. Create archives
    - name: Create archives
      run: |
        tar -czvf undoPLC-${{ github.ref_name }}.tar.gz -C release .
        zip -r undoPLC-${{ github.ref_name }}.zip release/

    # 9. GitHub Release
    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: |
          undoPLC-${{ github.ref_name }}.tar.gz
          undoPLC-${{ github.ref_name }}.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}